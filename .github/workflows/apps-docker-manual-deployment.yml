name: Manual deployment

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: 'Service name to deploy'
      deployment-environment:
        required: true
        type: string
        description: 'Target environment'
      quay-registry-path:
        required: true
        type: string
        description: 'The registry path from quay of the Docker image to deploy. Check "Print image url" step'
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_TOKEN:
        required: true

jobs:
  deployment:
    name: "Deploy to: ${{ inputs.deployment-environment }}"
    runs-on: ubuntu-latest
    steps:
      - name: Validate image reference format
        env:
          IMAGE: ${{ inputs.quay-registry-path }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^quay\.io/decentraland/[^:[:space:]]+:[A-Za-z0-9_][A-Za-z0-9_.\-]{0,127}$ ]]; then
            echo "::error::Invalid quay-registry-path: '$IMAGE'. Expected format: quay.io/decentraland/<image-name>:<tag-or-sha> (e.g. quay.io/decentraland/realm-provider:0.0.15)"
            exit 1
          fi

      - name: Trigger deployment
        id: deploy
        uses: decentraland/dcl-deploy-action@main
        with:
          dockerImage: "${{ inputs.quay-registry-path }}"
          serviceName: ${{ inputs.service-name }}
          env: ${{ inputs.deployment-environment }}
          token: ${{ secrets.GITHUB_TOKEN }}

